global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gigly-api-local'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:5000', '127.0.0.1:5000']

  - job_name: 'gigly-api-container'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:5000', 'host.docker.internal:5000']
